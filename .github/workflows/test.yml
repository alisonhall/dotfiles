# Checks the repo's shell files, then runs install.sh on fresh macOS, Linux and Windows
# machines to make sure it sets everything up, is safe to re-run, and can repair itself.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Syntax check (bash and zsh)
        run: bash tools/check-syntax.sh

      - name: No hard-coded paths
        run: bash tools/check-paths.sh

      - name: No OS-specific file names or paths
        run: bash tools/check-portability.sh

      - name: Aliases are valid on every OS (with dash, Ubuntu's sh, for git aliases)
        run: bash tools/check-aliases.sh

      - name: shellcheck (errors only)
        # git-branch-status is a third-party script, kept as its authors wrote it
        run: |
          shellcheck --version
          shellcheck -S error -s bash install.sh .githooks/pre-commit .githooks/commit-msg tools/*.sh \
            shell/bashrc.sh shell/common.sh shell/common/*.sh shell/os/*.sh \
            $(find bin -maxdepth 1 -type f ! -name git-branch-status) git/*.sh git/wt/*.sh

  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DOTFILES_SKIP_GITLEAKS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Repo checks work on this OS
        # The commit hook runs these on whatever machine you commit from (e.g. macOS's bash 3.2 and BSD awk)
        run: |
          bash tools/check-syntax.sh
          bash tools/check-paths.sh
          bash tools/check-portability.sh
          bash tools/check-aliases.sh

      - name: Install bats
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get install -y -q bats ;;
            macOS) brew install bats-core ;;
            Windows) npm install -g bats ;;
          esac

      - name: Unit tests (__test__ folders)
        run: bash tools/run-tests.sh

      - name: Works with macOS's built-in bash 3.2 (unit tests)
        if: runner.os == 'macOS'
        run: PATH="/bin:$PATH" /bin/bash tools/run-tests.sh

      - name: First install
        run: ./install.sh

      - name: Second install changes nothing
        run: |
          ./install.sh | tee second-run.txt
          if grep -E 'Added|Updated|Removed|Backed up|Created' second-run.txt; then
            echo "::error::The second run changed something - install.sh should be safe to re-run"
            exit 1
          fi

      - name: --check passes
        run: ./install.sh --check

      - name: Works with macOS's built-in bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash ./install.sh --check

      - name: Repairs the setup after the repo moves
        run: |
          sed -i.orig 's|^export DOTFILES=.*|export DOTFILES="/moved/away"|' ~/.bashrc
          ./install.sh | tee repair.txt
          grep -q 'Updated the dotfiles block' repair.txt

      - name: Works from any folder name, with spaces in the repo and home paths
        # (cd + pwd turns the Windows runner's D:\a\_temp into /d/a/_temp)
        run: |
          tmp="$(cd "$RUNNER_TEMP" && pwd)"
          mkdir -p "$tmp/Jane Doe"
          git clone -q . "$tmp/My Stuff/dot files (copy)"
          HOME="$tmp/Jane Doe" "$tmp/My Stuff/dot files (copy)/install.sh"
          HOME="$tmp/Jane Doe" "$tmp/My Stuff/dot files (copy)/install.sh" --check

      - name: New shells explain when the repo has moved, and install.sh repairs it
        run: |
          tmp="$(cd "$RUNNER_TEMP" && pwd)"
          mv "$tmp/My Stuff" "$tmp/Moved Stuff"
          HOME="$tmp/Jane Doe" bash -ic true 2> moved.txt || true
          grep -q "can't find" moved.txt || { cat moved.txt; exit 1; }
          HOME="$tmp/Jane Doe" "$tmp/Moved Stuff/dot files (copy)/install.sh" | tee moved-install.txt
          grep -q 'It loaded the dotfiles from' moved-install.txt

      - name: Works when downloaded as a ZIP (no .git folder)
        run: |
          tmp="$(cd "$RUNNER_TEMP" && pwd)"
          mkdir -p "$tmp/zip" "$tmp/zip-home"
          git archive HEAD | tar -x -C "$tmp/zip"
          HOME="$tmp/zip-home" "$tmp/zip/install.sh" | tee zip.txt
          grep -q "isn't a git clone" zip.txt

      - name: Shell functions and git aliases work
        # Output goes to files rather than `| head`, which fails under the runner's pipefail
        # (showa and git aliases print colour codes, so only match single words)
        run: |
          expect() {  # expect <file> <text>: fail, showing the file, if it doesn't contain the text
            grep -q "$2" "$1" || { echo "::error::'$2' not found in $1:"; cat "$1"; exit 1; }
          }
          bash -ic 'print-workspace-variables && type ll && showa killport' > bash-output.txt
          expect bash-output.txt 'DOTFILES_OS:'
          expect bash-output.txt 'killport'
          if command -v zsh >/dev/null; then
            zsh -ic 'print-workspace-variables && type ll' > zsh-output.txt
            expect zsh-output.txt 'DOTFILES_OS:'
          fi
          git aliases > git-aliases.txt
          expect git-aliases.txt 'cwip'
